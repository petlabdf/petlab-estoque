<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetLab — Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F1F5F9;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;
  --teal:#0D9488;--teal-d:#0F766E;--teal-l:#CCFBF1;
  --indigo:#4F46E5;--indigo-l:#EEF2FF;
  --sh:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --sh-hover:0 12px 28px rgba(15,23,42,.12),0 4px 10px rgba(15,23,42,.06);
}
body{
  font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:60px 20px;
}
.top-brand{text-align:center;margin-bottom:6px}
.top-brand .y{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--teal);text-transform:uppercase}
.top-brand .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:26px 0 6px;text-align:center}
.lead{font-size:14.5px;color:var(--muted);text-align:center;max-width:520px;margin-bottom:44px;line-height:1.5}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:820px;width:100%}
@media(max-width:680px){.cards{grid-template-columns:1fr}}

.card{
  background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);
  padding:30px 26px;text-decoration:none;color:inherit;display:flex;flex-direction:column;
  transition:.2s;position:relative;overflow:hidden;cursor:pointer;
  font-family:inherit;text-align:left;width:100%;
}
.card:hover{box-shadow:var(--sh-hover);transform:translateY(-3px);border-color:var(--teal)}
.card .icon{
  width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:26px;margin-bottom:18px;
}
.card.c-estoque .icon{background:var(--teal-l);}
.card.c-compras .icon{background:var(--indigo-l);}
.card h2{font-size:18px;font-weight:700;margin-bottom:8px;letter-spacing:-.01em}
.card p{font-size:13.5px;color:var(--muted);line-height:1.55;margin-bottom:18px;flex:1}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.tag{font-size:11px;font-weight:600;padding:4px 10px;border-radius:100px;background:#F1F5F9;color:var(--muted)}
.card .go{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.card.c-estoque .go{color:var(--teal-d)}
.card.c-compras .go{color:var(--indigo)}
.card .go .arrow{transition:.2s}
.card:hover .go .arrow{transform:translateX(3px)}

.footer{margin-top:56px;font-size:11.5px;color:var(--muted);text-align:center}

#app-view{display:none;position:fixed;inset:0;background:#fff;z-index:999}
#app-frame{width:100%;height:100%;border:none;display:block}
#app-loading{position:fixed;inset:0;background:#fff;z-index:1000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}
#app-loading .spin{width:34px;height:34px;border:3px solid #E2E8F0;border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#app-loading p{font-size:13px;color:var(--muted);font-weight:600}
</style>
</head>
<body>

<div id="hub-view">
  <div class="top-brand">
    <div class="y">Y.Consultoria</div>
    <div class="sub">Programa Evolua 360° · PetLab DF</div>
  </div>

  <h1>Painel PetLab</h1>
  <p class="lead">Escolha o sistema que você quer acessar. Cada um funciona de forma independente, com seus próprios dados.</p>

  <div class="cards">

    <button class="card c-estoque" onclick="openApp('estoque')">
      <div class="icon">🔬</div>
      <h2>Sistema de Estoque</h2>
      <p>Contagem de estoque, registro de compras de insumos, cálculo de CMV, cadastro de produtos e alertas de estoque mínimo.</p>
      <div class="tags">
        <span class="tag">Contagem</span>
        <span class="tag">CMV</span>
        <span class="tag">Produtos</span>
        <span class="tag">Alertas</span>
      </div>
      <div class="go">Acessar sistema <span class="arrow">→</span></div>
    </button>

    <button class="card c-compras" onclick="openApp('compras')">
      <div class="icon">💧</div>
      <h2>Compras & Projeção</h2>
      <p>Controle semanal de caixa, projeção financeira, orçamento de compras do mês, gestão de fornecedores, visão semanal e análises de resultado.</p>
      <div class="tags">
        <span class="tag">Fluxo de Caixa</span>
        <span class="tag">Projeção</span>
        <span class="tag">Orçamento</span>
        <span class="tag">Fornecedores</span>
      </div>
      <div class="go">Acessar sistema <span class="arrow">→</span></div>
    </button>

  </div>

  <div class="footer">Dúvidas no dia a dia? Fale com a Y.Consultoria.</div>
</div>

<div id="app-loading"><div class="spin"></div><p>Carregando...</p></div>
<div id="app-view"><iframe id="app-frame"></iframe></div>

function b64ToUtf8(b64){
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

function openApp(key){
  document.getElementById('hub-view').style.display = 'none';
  document.getElementById('app-loading').style.display = 'flex';
  setTimeout(() => {
    const html = b64ToUtf8(APPS[key]);
    const frame = document.getElementById('app-frame');
    frame.srcdoc = html;
    document.getElementById('app-loading').style.display = 'none';
    document.getElementById('app-view').style.display = 'block';
  }, 30);
}

  document.getElementById('hub-view').style.flexDirection = 'column';
  document.getElementById('hub-view').style.alignItems = 'center';
}

window.addEventListener('message', function(e){
  if(e.data === 'petlab-go-home'){ goHome(); }
});
</script>
